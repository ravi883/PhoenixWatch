<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Phoenix - Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#747878",
                        "on-surface-variant": "#444748",
                        "secondary": "#5d5f5f",
                        "tertiary-fixed": "#e6e1df",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#fcf9f8",
                        "surface-tint": "#5f5e5e",
                        "on-primary-fixed": "#1c1b1b",
                        "on-tertiary-container": "#868381",
                        "background": "#fcf9f8",
                        "tertiary-fixed-dim": "#cac6c3",
                        "tertiary-container": "#1d1b1a",
                        "on-secondary-container": "#616363",
                        "primary-fixed": "#e5e2e1",
                        "on-secondary-fixed-variant": "#454747",
                        "surface-dim": "#dcd9d9",
                        "on-surface": "#1b1c1c",
                        "surface-variant": "#e4e2e1",
                        "on-tertiary-fixed": "#1d1b1a",
                        "on-tertiary-fixed-variant": "#484645",
                        "on-secondary-fixed": "#1a1c1c",
                        "on-primary-container": "#858383",
                        "tertiary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#e2e2e2",
                        "primary-container": "#1c1b1b",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "secondary-container": "#dfe0e0",
                        "surface": "#fcf9f8",
                        "surface-container": "#f0eded",
                        "error": "#ba1a1a",
                        "surface-container-high": "#eae7e7",
                        "inverse-on-surface": "#f3f0ef",
                        "outline-variant": "#c4c7c7",
                        "inverse-primary": "#c9c6c5",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#c9c6c5",
                        "surface-container-highest": "#e4e2e1",
                        "on-primary-fixed-variant": "#474646",
                        "inverse-surface": "#303030",
                        "on-background": "#1b1c1c",
                        "surface-container-low": "#f6f3f2",
                        "error-container": "#ffdad6",
                        "primary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "unit": "4px",
                        "margin-mobile": "20px",
                        "container-max": "1440px",
                        "stack-sm": "8px",
                        "gutter": "24px",
                        "stack-lg": "32px",
                        "section-gap": "120px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "headline-md": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "display-lg-mobile": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "display-lg-mobile": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
</head>
    <body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md antialiased">
        <!-- Main Container: Split Screen on Desktop -->
        <main class="w-full min-h-screen flex flex-col lg:flex-row">
            <!-- Left Side: Image / Brand Anchor -->
            <section class="hidden lg:block lg:w-1/2 relative bg-surface-container-high overflow-hidden">
                <div class="absolute inset-0 bg-cover bg-center w-full h-full" data-alt="" 
                style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDJjzZ-ol4Mt_SdQR-hFo7Q5a5evNHOfv5HPYreEWlytgZ7XeZO1OaVnTKAu8EHgq3fpHjJ3Jz6a2Ba3EZrWpNIYrvWZ_9AmX2BF3XYwieyUmzqBxT7C7wnqj9OIaQHar3bi52khRMMbzpEfdjFd_uH0GEtiHFup5iRh6iOjmtKoezof2k735YOAW_oo37oBguNHCNLSQeZ11IP8_3897kkcOllxKJUpslQk3UN2c9S9OA4j1xKo5Yc')"></div>
                <!-- Overlay to ensure text readability if needed -->
                <div class="absolute inset-0 bg-tertiary/20"></div>
                <div class="absolute top-margin-desktop left-margin-desktop z-10">
                    <a class="font-display-lg text-headline-lg font-semibold tracking-tight text-on-primary" href="#">
                        Phoenix
                    </a>
                </div>
            </section>

            <!-- Right Side: Form Content -->
            <section class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile lg:p-margin-desktop relative">
                <!-- Mobile Brand Header -->
                <div class="absolute top-margin-mobile left-margin-mobile lg:hidden w-full text-center">
                    <a class="font-display-lg-mobile text-headline-lg font-semibold tracking-tight text-primary" href="#">
                        Phoenix
                    </a>
                </div>

                <!-- Form Container -->
                <div class="w-full max-w-[400px] flex flex-col gap-stack-lg animate-fade-in-up mt-[80px] lg:mt-0">
                    <!-- Header -->
                    <div class="flex flex-col gap-stack-sm text-center lg:text-left">
                        <h1 class="font-headline-lg text-headline-lg text-primary">Forgot Password?</h1>
                        <p class="font-body-md text-body-md text-secondary">
                                                Enter your email to receive reset instructions
                        </p>
                    </div>
                    <!-- Form -->
                    <form action="#" class="flex flex-col gap-gutter" method="POST">
                        {% csrf_token %}
                        <!-- Email Input -->
                        <div class="flex flex-col gap-unit relative">
                            <label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.1em]" for="email">Email Address</label>
                            <div class="relative">
                                <span class="absolute left-0 top-1/2 -translate-y-1/2 material-symbols-outlined text-secondary ml-2">mail</span>
                                <input class="w-full bg-surface border-0 border-b border-outline-variant py-3 pl-10 pr-4 text-on-surface focus:ring-0 focus:border-on-surface transition-colors duration-300 font-body-md text-body-md bg-transparent placeholder-on-surface-variant/50" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
                            </div>
                        </div>
                        <!-- Submit Button -->
                        <button class="mt-stack-md w-full bg-primary text-on-primary py-4 rounded-DEFAULT font-label-caps text-label-caps uppercase tracking-[0.1em] hover:bg-on-surface-variant transition-colors duration-300 shadow-[0_4px_20px_rgba(0,0,0,0.06)] hover:shadow-[0_6px_24px_rgba(0,0,0,0.1)] flex justify-center items-center gap-2 group" type="submit">
                                                Send Reset Link
                            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform duration-300">arrow_forward</span>
                        </button>
                    </form>

                    <!-- Back to Login Link -->
                    <div class="text-center pt-stack-sm">
                        <a class="inline-flex items-center gap-2 font-body-md text-body-md text-secondary hover:text-primary transition-colors duration-300 group" href="{% url 'login' %}">
                            <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform duration-300">arrow_back</span>
                                                Back to Login
                        </a>
                    </div>
                </div>
            </section>
        </main>

<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</body></html>
